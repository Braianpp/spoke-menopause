name: Verify processed results
on: [push, pull_request, workflow_dispatch]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-tested.txt
      - run: python -m pip install -e .
      - run: python -m pytest -q
      - run: spoke-menopause validate
      - run: spoke-menopause export-tables
      - run: spoke-menopause figures
